  <g>
    <rect x="7" y="13" width="19" height="54" rx="5" fill="#242725" opacity=".28"/>
    <rect x="8" y="14" width="18" height="52" rx="4.5" fill="url(#bracket)" stroke="#272b28" stroke-width="1.2"/>
