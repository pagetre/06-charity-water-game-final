<svg xmlns="http://www.w3.org/2000/svg" width="192" height="80" viewBox="0 0 192 80">

<defs>
  <linearGradient id="pipeMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c3c8c5"/>
    <stop offset="0.48" stop-color="#aeb5b2"/>
    <stop offset="1" stop-color="#929a97"/>
  </linearGradient>
  <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="0">
