<svg xmlns="http://www.w3.org/2000/svg" width="192" height="80" viewBox="0 0 192 80">

<defs>
  <linearGradient id="pipeMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c3c8c5"/>
    <stop offset="0.48" stop-color="#aeb5b2"/>
    <stop offset="1" stop-color="#929a97"/>
  </linearGradient>
  <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a3d3b"/>
    <stop offset="0.5" stop-color="#555957"/>
    <stop offset="1" stop-color="#303331"/>
  </linearGradient>
  <linearGradient id="dirt" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#87603c"/>
    <stop offset="0.55" stop-color="#68462d"/>
    <stop offset="1" stop-color="#4b3425"/>
  </linearGradient>
  <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>

  <!-- subtle cast shadow -->
  <rect x="7" y="18" width="178" height="45" rx="3" fill="#000" opacity=".18" filter="url(#softShadow)"/>
  <!-- pipe body -->
  <rect x="13" y="20" width="166" height="40" rx="2" fill="#454a47" opacity=".65"/>
  <rect x="18" y="20" width="156" height="40" rx="1.5" fill="url(#pipeMetal)" stroke="#343936" stroke-width="1.4"/>
  <path d="M19 23 H173" stroke="#d6dbd8" stroke-width="1.5" opacity=".7"/>
  <path d="M19 56 H173" stroke="#737b77" stroke-width="1.2" opacity=".75"/>
  <!-- cracked opening, with dark jagged rim -->
  <path d="M74 21 L83 30 L78 36 L89 42 L82 49 L88 59 L101 59 L96 49 L105 42 L97 35 L103 28 L94 21 Z" fill="#292c29" stroke="#34332c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- compacted dirt filling the split -->
  <path d="M77 23 L84 30 L80 36 L91 42 L85 49 L90 57 L98 57 L93 49 L102 42 L94 35 L100 28 L93 23 L90 31 L86 34 L89 41 L83 36 L87 30 Z" fill="url(#dirt)" stroke="#4b3425" stroke-width="1" stroke-linejoin="round"/>
  <path d="M80 28 l4 2 -2 3 4 2 -3 3" fill="none" stroke="#a67a4b" stroke-width="1.2" opacity=".8"/><circle cx="91" cy="47" r="1.5" fill="#3f2b1d"/><circle cx="94" cy="53" r="1" fill="#b08a5b"/>
  <!-- end brackets -->
  <g>
    <rect x="7" y="13" width="19" height="54" rx="5" fill="#242725" opacity=".28"/>
    <rect x="8" y="14" width="18" height="52" rx="4.5" fill="url(#bracket)" stroke="#272b28" stroke-width="1.2"/>
    <rect x="9.5" y="16" width="2" height="48" rx="1" fill="#747a76" opacity=".45"/>
    <circle cx="17" cy="24" r="3.1" fill="#222624" stroke="#777e79" stroke-width="1"/>
    <circle cx="17" cy="56" r="3.1" fill="#222624" stroke="#777e79" stroke-width="1"/>
    <rect x="167" y="13" width="19" height="54" rx="5" fill="#242725" opacity=".28"/>
    <rect x="168" y="14" width="18" height="52" rx="4.5" fill="url(#bracket)" stroke="#272b28" stroke-width="1.2"/>
    <rect x="169.5" y="16" width="2" height="48" rx="1" fill="#747a76" opacity=".45"/>
    <circle cx="177" cy="24" r="3.1" fill="#222624" stroke="#777e79" stroke-width="1"/>
    <circle cx="177" cy="56" r="3.1" fill="#222624" stroke="#777e79" stroke-width="1"/>
  </g>
</svg>